name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  js:
    name: lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund 2>&1 | tee /tmp/install.log

      - name: Lint
        id: lint
        run: npm run lint 2>&1 | tee /tmp/lint.log

      - name: Format
        id: format
        run: npm run format:check 2>&1 | tee /tmp/format.log

      - name: Typecheck
        id: typecheck
        run: npm run typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Tests
        id: test
        run: npm test 2>&1 | tee /tmp/test.log

      # Failures are reported back onto the pull request so the log is readable where the
      # change is reviewed, not only inside the Actions UI.
      - name: Report failure on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### CI failure - JavaScript job"
            echo
            for name in install lint format typecheck test; do
              if [ -f "/tmp/$name.log" ]; then
                echo "<details><summary>$name (last 80 lines)</summary>"
                echo
                echo '```'
                tail -n 80 "/tmp/$name.log"
                echo '```'
                echo
                echo "</details>"
                echo
              fi
            done
          } > /tmp/report.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/report.md

  android:
    name: android debug apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund 2>&1 | tee /tmp/install.log

      # Best effort: the runner image usually already ships these packages, and the Android
      # Gradle Plugin can fetch what is missing. The installed list is logged so a failure
      # tells us which platforms the runner actually has.
      - name: Install Android SDK packages
        id: sdk
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER=sdkmanager
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          {
            (yes | "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -n 5) || true
            echo "--- installed platforms and build-tools ---"
            ("$SDKMANAGER" --list_installed 2>/dev/null | grep -E 'platforms;|build-tools;') || true
          } | tee /tmp/sdk.log

      # The Gradle wrapper JAR is not committed, so CI provisions Gradle itself.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1

      - name: Assemble debug APK
        id: assemble
        working-directory: android
        run: gradle assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon 2>&1 | tee /tmp/assemble.log

      # Regression guard for the defect found on a real phone after Phase 1: a debug APK
      # without a packaged JS bundle installs fine and then fails at launch with "Unable to
      # load script". An APK that cannot start is not a passing build.
      - name: Verify the APK carries the JavaScript bundle
        id: verify_apk
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -E 'assets/|lib/' | tee /tmp/verify_apk.log
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: devour-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Report failure on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### CI failure - Android job"
            echo
            for name in install sdk assemble verify_apk; do
              if [ -f "/tmp/$name.log" ]; then
                echo "<details><summary>$name (last 120 lines)</summary>"
                echo
                echo '```'
                tail -n 120 "/tmp/$name.log"
                echo '```'
                echo
                echo "</details>"
                echo
              fi
            done
          } > /tmp/report.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/report.md
